# NOT applied by the kustomization. Create the real one from a secret store
# (sealed-secrets, external-secrets, or by hand), never from git:
#   kubectl -n assessmatrix create secret generic assessmatrix --from-env-file=prod.env
apiVersion: v1
kind: Secret
metadata:
  name: assessmatrix
type: Opaque
stringData:
  AM_DATABASE_URL: postgres://am_app:CHANGE@db.internal:5432/assessmatrix?sslmode=verify-full
  AM_MIGRATE_DATABASE_URL: postgres://am_owner:CHANGE@db.internal:5432/assessmatrix?sslmode=verify-full
  AM_SECRET: CHANGE # openssl rand -hex 32; losing it loses every issuer key and breaks every seal
  AM_SMTP_ADDR: smtp.example.id:587
  AM_SMTP_FROM: AssessMatrix <noreply@example.id>
  AM_SMTP_USER: CHANGE
  AM_SMTP_PASS: CHANGE
  AM_S3_ENDPOINT: s3.ap-southeast-3.amazonaws.com
  AM_S3_BUCKET: assessmatrix-media-id
  AM_S3_ACCESS_KEY: CHANGE
  AM_S3_SECRET_KEY: CHANGE
