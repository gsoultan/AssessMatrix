# Inbound: the app port from the ingress controller, metrics from the
# monitoring namespace, nothing else. Adjust the namespace labels to the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: core }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 9090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: psychometrics
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: psychometrics }
  policyTypes: [Ingress]
