apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: core }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: core }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      # Long enough for in-flight saves and mail jobs to finish (the core
      # drains for 20 s on SIGTERM).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: core } }
      containers:
        - name: core
          image: assessmatrix
          args: [serve]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: assessmatrix }
          env:
            - name: AM_DATABASE_URL
              valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_DATABASE_URL } }
            - name: AM_SECRET
              valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_SECRET } }
            - { name: AM_SMTP_ADDR, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_SMTP_ADDR } } }
            - { name: AM_SMTP_FROM, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_SMTP_FROM } } }
            - { name: AM_SMTP_USER, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_SMTP_USER } } }
            - { name: AM_SMTP_PASS, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_SMTP_PASS } } }
            - { name: AM_S3_ENDPOINT, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_S3_ENDPOINT } } }
            - { name: AM_S3_BUCKET, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_S3_BUCKET } } }
            - { name: AM_S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_S3_ACCESS_KEY } } }
            - { name: AM_S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: assessmatrix, key: AM_S3_SECRET_KEY } } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector: { app.kubernetes.io/name: core }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: core }
