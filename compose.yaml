# One compose file for local development and small self-hosted installs
# (docs/03 §3: self-host is a first-class artifact). Put secrets in .env;
# see .env.example. Production on one machine (docs/13):
#
#   docker compose --profile tls up -d     # with Caddy and HTTPS on AM_DOMAIN
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AM_OWNER_PASSWORD: ${AM_OWNER_PASSWORD:?set AM_OWNER_PASSWORD in .env}
      AM_APP_PASSWORD: ${AM_APP_PASSWORD:?set AM_APP_PASSWORD in .env}
      # Base backups `make backup` keeps on the machine (one a night: days).
      AM_BACKUP_KEEP: ${AM_BACKUP_KEEP:-7}
    # Every WAL segment is copied to the archive volume as it fills (or each
    # minute), gzipped, so with a base backup the database can be restored to
    # any moment (docs/13 §3, scripts/restore-drill.sh). A segment closed by
    # the minute's timeout is mostly empty and gzips to a few KB instead of
    # 16 MB. `make backup` (nightly) takes the base backup and prunes what no
    # backup needs any more. Copy that volume off the machine: a backup on
    # the same disk is not a backup.
    command:
      - bash
      - -c
      - >-
        mkdir -p /archive/wal && chown -R postgres /archive &&
        exec docker-entrypoint.sh postgres
        -c wal_level=replica -c archive_mode=on -c archive_timeout=60 -c wal_compression=lz4
        -c archive_command='test ! -f /archive/wal/%f.gz && gzip -c %p > /archive/wal/%f.gz.part && mv /archive/wal/%f.gz.part /archive/wal/%f.gz'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/archive
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./deploy/postgres/backup.sh:/backup.sh:ro
    # AM_PG_PORT in .env when 5432 is taken (a Homebrew Postgres, say).
    ports: ["127.0.0.1:${AM_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  migrate:
    build: &image
      context: .
      dockerfile: deploy/Dockerfile
    image: assessmatrix:local
    command: ["migrate"]
    environment:
      AM_MIGRATE_DATABASE_URL: postgres://am_owner:${AM_OWNER_PASSWORD}@postgres:5432/assessmatrix
      # Seals attempts written before attempt rows were sealed (migration 0008).
      AM_SECRET: ${AM_SECRET:?set AM_SECRET in .env (openssl rand -hex 32)}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  core:
    build: *image
    image: assessmatrix:local
    command: ["serve"]
    environment:
      AM_DATABASE_URL: postgres://am_app:${AM_APP_PASSWORD}@postgres:5432/assessmatrix
      AM_SECRET: ${AM_SECRET:?set AM_SECRET in .env (openssl rand -hex 32)}
      AM_PUBLIC_URL: ${AM_PUBLIC_URL:-http://localhost:5180}
      # Where candidates open their links. Point a second hostname at this
      # service to give the runner its own origin; unset, it is AM_PUBLIC_URL.
      AM_RUNNER_URL: ${AM_RUNNER_URL:-}
      AM_MAILER: ${AM_MAILER:-log}
      # 1 behind the tls profile's Caddy, so rate limits see the real client.
      AM_TRUST_PROXY: ${AM_TRUST_PROXY:-0}
      # Calls a minute per address and per tenant; raise the first for an
      # exam hall behind one NAT address. Empty is the default (60, 600).
      AM_LIMIT_PER_IP: ${AM_LIMIT_PER_IP:-}
      AM_LIMIT_PER_TENANT: ${AM_LIMIT_PER_TENANT:-}
      AM_DEV: ${AM_DEV:-0}
      AM_SMTP_ADDR: ${AM_SMTP_ADDR:-}
      AM_SMTP_FROM: ${AM_SMTP_FROM:-}
      AM_SMTP_USER: ${AM_SMTP_USER:-}
      AM_SMTP_PASS: ${AM_SMTP_PASS:-}
      # Images. fs keeps them on the media volume; s3 sends them to any
      # S3-compatible store (set AM_S3_* in .env). Either way the store is in
      # AM_MEDIA_REGION, and tenants of another region cannot upload here.
      AM_MEDIA_STORE: ${AM_MEDIA_STORE:-fs}
      AM_MEDIA_DIR: /data/media
      AM_MEDIA_REGION: ${AM_MEDIA_REGION:-id}
      AM_S3_ENDPOINT: ${AM_S3_ENDPOINT:-}
      AM_S3_BUCKET: ${AM_S3_BUCKET:-}
      AM_S3_ACCESS_KEY: ${AM_S3_ACCESS_KEY:-}
      AM_S3_SECRET_KEY: ${AM_S3_SECRET_KEY:-}
    volumes:
      - media:/data/media
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    profiles: [tls]
    environment:
      # Set AM_DOMAIN in .env; "localhost" gets a local, untrusted certificate.
      AM_DOMAIN: ${AM_DOMAIN:-localhost}
      AM_RUNNER_DOMAIN: ${AM_RUNNER_DOMAIN:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [core]
    restart: unless-stopped

  psychometrics:
    build: ./services/psychometrics
    environment:
      AM_DATABASE_URL: postgres://am_app:${AM_APP_PASSWORD}@postgres:5432/assessmatrix
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  walarchive:
  media:
  caddy:
