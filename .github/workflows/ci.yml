name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: make check
      - run: make build
      - name: Install Chromium for the Playwright version the studio pins
        working-directory: apps/studio
        run: bunx playwright install --with-deps chromium
      - run: make e2e

  proto:
    name: Proto · lint, breaking, generated code in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      - run: bun install --frozen-lockfile
      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
      - name: buf lint
        working-directory: packages/proto
        run: ./node_modules/.bin/buf lint
      - name: buf breaking against main
        working-directory: packages/proto
        run: |
          if git cat-file -e origin/main:packages/proto/buf.yaml 2>/dev/null; then
            ./node_modules/.bin/buf breaking --against "../../.git#ref=origin/main,subdir=packages/proto"
          else
            echo "main has no schema yet; nothing to break"
          fi
      - name: Generated code matches the schema
        working-directory: packages/proto
        run: |
          PATH="$PATH:$(go env GOPATH)/bin:$PWD/node_modules/.bin" ./node_modules/.bin/buf generate
          git diff --exit-code -- . ../../services/core/gen
          test -z "$(git status --porcelain -- . ../../services/core/gen)"

  core:
    name: Core · vet, test against Postgres with RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/core
    env:
      AM_TEST_DATABASE_URL: postgres://am_app:app@localhost:5432/assessmatrix_test
      AM_TEST_MIGRATE_DATABASE_URL: postgres://am_owner:owner@localhost:5432/assessmatrix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: services/core/go.sum
      - name: Create the owner and the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE am_owner LOGIN PASSWORD 'owner'" \
            -c "CREATE ROLE am_app LOGIN PASSWORD 'app'" \
            -c "CREATE DATABASE assessmatrix_test OWNER am_owner"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  psychometrics:
    name: Psychometrics · item statistics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/psychometrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v

  supply-chain:
    name: Supply chain · known vulnerabilities, committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: services/core/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Web dependencies
        run: bun audit
      - name: Go dependencies and standard library (reachable code only)
        working-directory: services/core
        env:
          GOTOOLCHAIN: go1.27.2
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r services/psychometrics/requirements.txt
      - name: No secrets in the history
        env:
          GOTOOLCHAIN: go1.27.2
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 git --no-banner --redact .

  deploy:
    name: Deploy · image, configs, restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t assessmatrix:local --build-arg VERSION=ci .
      - name: Compose file
        env: { POSTGRES_PASSWORD: x, AM_OWNER_PASSWORD: x, AM_APP_PASSWORD: x, AM_SECRET: x }
        run: docker compose --profile tls config -q
      - name: Caddyfile
        run: docker run --rm -e AM_DOMAIN=exam.example.id -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Alert rules and their tests
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/r" -w /r --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/r" -w /r --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: services/core/go.sum
      - name: Kubernetes manifests
        env: { GOTOOLCHAIN: go1.27.2 }
        run: |
          go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.3 build deploy/k8s > /tmp/k8s.yaml
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary /tmp/k8s.yaml
      - name: Restore drill (point-in-time, on throwaway containers)
        run: bash scripts/restore-drill.sh

  stack:
    name: Stack · studio against the core and Postgres
    runs-on: ubuntu-latest
    # Includes the phase 4 gate: a five-minute network outage, in real time.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AM_E2E_DATABASE_URL: postgres://am_app:app@localhost:5432/assessmatrix
      AM_E2E_MIGRATE_DATABASE_URL: postgres://am_owner:owner@localhost:5432/assessmatrix
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: services/core/go.sum
      - run: bun install --frozen-lockfile
      - name: Create the owner and the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE am_owner LOGIN PASSWORD 'owner'" \
            -c "CREATE ROLE am_app LOGIN PASSWORD 'app'" \
            -c "CREATE DATABASE assessmatrix OWNER am_owner"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the psychometrics worker's dependencies
        run: pip install -r services/psychometrics/requirements.txt
      - name: Install Chromium for the Playwright version the studio pins
        working-directory: apps/studio
        run: bunx playwright install --with-deps chromium
      - run: make e2e-core
