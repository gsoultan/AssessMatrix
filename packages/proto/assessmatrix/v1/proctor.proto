syntax = "proto3";

package assessmatrix.v1;

import "assessmatrix/v1/assignment.proto";
import "assessmatrix/v1/result.proto";

// Live monitoring of an exam's sittings, for staff. One server stream per
// watcher; each message is the whole picture, sent when something changed.
service ProctorService {
  rpc WatchExam(WatchExamRequest) returns (stream WatchExamResponse);
  // More time for timed sittings still in progress: after an outage, a power
  // cut in the hall, or an agreed accommodation. Each deadline moves by the
  // same minutes, and each attempt's sealed log records the addition with
  // the reason, which the candidate sees in their record. Handed-in, untimed
  // and purged sittings are left as they are.
  rpc AddTime(AddTimeRequest) returns (AddTimeResponse);
}

message WatchExamRequest {
  string exam_id = 1;
}

message WatchExamResponse {
  int64 server_now = 1;
  repeated Sitting sittings = 2;
}

// One person's sitting of the exam: invited, in progress or handed in.
message Sitting {
  string assignment_id = 1;
  string person_name = 2;
  AssignStatus status = 3;
  // Empty until they start.
  string attempt_id = 4;
  int32 answered = 5;
  int32 total = 6;
  int64 started_at = 7;
  int64 submitted_at = 8;
  // When the server last heard from their device.
  int64 last_seen_at = 9;
  int32 score_pct = 10;
  repeated Flag flags = 11;
  // When a timed sitting in progress ends, by the server's clock; 0 when
  // untimed or not started.
  int64 deadline_at = 12;
}

message AddTimeRequest {
  string exam_id = 1;
  // The sittings to extend, all of this exam. Empty: every timed sitting of
  // the exam still in progress.
  repeated string assignment_ids = 2;
  // 1 to 240.
  int32 minutes = 3;
  // Why, in words for the candidate: it is shown in their record. Required,
  // up to 500 characters.
  string reason = 4;
}

message AddTimeResponse {
  // The sittings that were given the time, with their new deadlines.
  repeated TimeAdded added = 1;
}

message TimeAdded {
  string assignment_id = 1;
  int64 deadline_at = 2;
}
